# S POS — production stack (website / SaaS). Developed by Sridhar Mahalingam.
# Usage:  cp .env.production.example .env  &&  edit  &&  docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build:
      context: ../backend/v17src
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  worker:
    build:
      context: ../backend/v17src
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l info
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
      - ./certs:/etc/nginx/certs:ro     # put fullchain.pem + privkey.pem here (or use certbot)
      - ./webapp:/usr/share/nginx/html:ro  # built S POS web UI (npm run build with VITE_API_URL=/api/v1)
    depends_on:
      - web

volumes:
  db_data:
  redis_data:
  static_data:
  media_data:
